name: Daily Range Breakout Box Scanner

on:
  # 4:45 PM IST = 11:15 UTC, Mon-Fri (runs after update-dashboard at 11:00)
  schedule:
    - cron: '15 11 * * 1-5'

  # Run manually anytime from Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  box-scan:
    runs-on: ubuntu-latest
    # Allow up to 20 minutes — scans 500 tickers
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Box Scanner
        run: python scripts/box_scanner.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code data/box_scanner.json box-dashboard.html || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated dashboard
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/box_scanner.json box-dashboard.html
          git commit -m "🤖 Auto-scan: Box breakout dashboard ($(date +'%Y-%m-%d %H:%M IST'))"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No new breakout setups. Skipping commit."

      - name: Done
        run: echo "✅ Box scanner complete. GitHub Pages will auto-deploy in ~2 minutes."
