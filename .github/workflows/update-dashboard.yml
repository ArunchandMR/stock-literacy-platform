name: Update Stock Dashboard

on:
  # 4:30 PM IST = 11:00 UTC, Mon-Fri (after NSE market close at 3:30 PM IST)
  schedule:
    - cron: '0 11 * * 1-5'

  # Allow manual trigger anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # No pip cache here — ensures fresh yfinance on every run
          # (cached yfinance sessions can cause stale cookie issues)

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch stock data
        run: python scripts/fetch_stock_data.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code data/dashboard.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/dashboard.json
          git commit -m "🤖 Auto-update: Stock dashboard ($(date +'%Y-%m-%d %H:%M IST'))"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No changes in dashboard data. Skipping commit."

      - name: Done
        run: |
          echo "✓ Dashboard update complete. GitHub Pages will auto-deploy in ~2 minutes."
