name: Process Stock Add Request

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  add-stock:
    # Triggers only when admin applies the 'approved' label
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Parse issue and add stock
        id: parse
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE:  ${{ github.event.issue.title }}
          ISSUE_BODY:   ${{ github.event.issue.body }}
        run: |
          python3 << 'PYTHON_EOF'
          import json, os, re
          from datetime import datetime, timezone

          issue_number = os.environ['ISSUE_NUMBER']
          issue_title  = os.environ['ISSUE_TITLE']
          issue_body   = os.environ['ISSUE_BODY']

          print(f"Processing add request: issue #{issue_number}")

          # ── Parse the user-supplied fields ────────────────────────────────
          def extract(body, label):
              """Extract value after a GitHub issue form ### label line."""
              pattern = rf'###[^\S\r\n]*{re.escape(label)}[^\S\r\n]*\n+([^\n#]+)'
              m = re.search(pattern, body, re.IGNORECASE)
              if m:
                  v = m.group(1).strip()
                  return v if v and v != '_No response_' else None
              return None

          stock_name_raw = extract(issue_body, '🏢 Company Name')
          entry_price_raw = extract(issue_body, '💰 Your Purchase Price (₹)')
          entry_date_raw  = extract(issue_body, '📅 Date of Purchase (optional)')

          # Also try legacy field names in case old issues come in
          if not stock_name_raw:
              stock_name_raw = extract(issue_body, 'Company Name')
          if not entry_price_raw:
              entry_price_raw = extract(issue_body, '💰 Your Entry Price (₹)') or \
                                extract(issue_body, 'Entry Price')

          def clean_price(val):
              if val is None: return None
              try: return float(re.sub(r'[^\d.]', '', val))
              except: return None

          def clean_date(val):
              if val is None: return None
              # Accept YYYY-MM-DD
              m = re.search(r'(\d{4}-\d{2}-\d{2})', str(val))
              return m.group(1) if m else None

          entry_price = clean_price(entry_price_raw)
          entry_date  = clean_date(entry_date_raw) or \
                        datetime.now(timezone.utc).strftime('%Y-%m-%d')

          if not stock_name_raw or entry_price is None:
              print(f"ERROR: Could not parse required fields.")
              print(f"  stock_name={stock_name_raw}  entry={entry_price}")
              exit(1)

          stock_name_input = stock_name_raw.strip()
          print(f"  Input name:   {stock_name_input}")
          print(f"  Entry price:  ₹{entry_price}")
          print(f"  Entry date:   {entry_date}")

          # ── Resolve company name → NSE ticker via yfinance ────────────────
          import yfinance as yf
          import numpy as np
          import pandas as pd

          ticker   = None
          name     = stock_name_input
          sector   = 'NSE'

          # Strategy 1: try common name → ticker mappings for popular NSE stocks
          COMMON_MAP = {
              'reliance': 'RELIANCE.NS', 'reliance industries': 'RELIANCE.NS',
              'tcs': 'TCS.NS', 'tata consultancy': 'TCS.NS', 'tata consultancy services': 'TCS.NS',
              'infosys': 'INFY.NS', 'infy': 'INFY.NS',
              'hdfc bank': 'HDFCBANK.NS', 'hdfcbank': 'HDFCBANK.NS',
              'icici bank': 'ICICIBANK.NS', 'icicibank': 'ICICIBANK.NS',
              'wipro': 'WIPRO.NS',
              'bajaj finance': 'BAJFINANCE.NS', 'bajfinance': 'BAJFINANCE.NS',
              'asian paints': 'ASIANPAINT.NS', 'asianpaint': 'ASIANPAINT.NS',
              'maruti': 'MARUTI.NS', 'maruti suzuki': 'MARUTI.NS',
              'sun pharma': 'SUNPHARMA.NS', 'sunpharma': 'SUNPHARMA.NS', 'sun pharmaceutical': 'SUNPHARMA.NS',
              'hul': 'HINDUNILVR.NS', 'hindustan unilever': 'HINDUNILVR.NS', 'hindunilvr': 'HINDUNILVR.NS',
              'axis bank': 'AXISBANK.NS', 'axisbank': 'AXISBANK.NS',
              'coal india': 'COALINDIA.NS', 'coalindia': 'COALINDIA.NS',
              'tech mahindra': 'TECHM.NS', 'techm': 'TECHM.NS',
              'ultratech cement': 'ULTRACEMCO.NS', 'ultracemco': 'ULTRACEMCO.NS',
              'titan': 'TITAN.NS', 'titan company': 'TITAN.NS',
              'ntpc': 'NTPC.NS',
              'adani enterprises': 'ADANIENT.NS', 'adanient': 'ADANIENT.NS',
              'tata motors': 'TATAMOTORS.NS', 'tatamotors': 'TATAMOTORS.NS',
              'bharti airtel': 'BHARTIARTL.NS', 'airtel': 'BHARTIARTL.NS', 'bhartiartl': 'BHARTIARTL.NS',
              'ongc': 'ONGC.NS', 'hindcopper': 'HINDCOPPER.NS', 'hindustan copper': 'HINDCOPPER.NS',
              'srf': 'SRF.NS', 'technoe': 'TECHNOE.NS', 'techno electric': 'TECHNOE.NS',
              'itc': 'ITC.NS', 'lt': 'LT.NS', 'larsen': 'LT.NS', 'larsen & toubro': 'LT.NS',
              'sbi': 'SBIN.NS', 'state bank': 'SBIN.NS', 'state bank of india': 'SBIN.NS',
              'kotak': 'KOTAKBANK.NS', 'kotak bank': 'KOTAKBANK.NS', 'kotak mahindra': 'KOTAKBANK.NS',
              'nestle': 'NESTLEIND.NS', 'nestle india': 'NESTLEIND.NS',
              'hcl': 'HCLTECH.NS', 'hcl tech': 'HCLTECH.NS', 'hcltech': 'HCLTECH.NS',
              'power grid': 'POWERGRID.NS', 'powergrid': 'POWERGRID.NS',
              'dr reddy': 'DRREDDY.NS', 'dr reddys': 'DRREDDY.NS', 'dr reddys labs': 'DRREDDY.NS',
              'cipla': 'CIPLA.NS', 'divis': 'DIVISLAB.NS', 'divis labs': 'DIVISLAB.NS',
              'bajaj auto': 'BAJAJ-AUTO.NS', 'hero motocorp': 'HEROMOTOCO.NS',
              'm&m': 'M&M.NS', 'mahindra': 'M&M.NS', 'mahindra & mahindra': 'M&M.NS',
              'jsw steel': 'JSWSTEEL.NS', 'tata steel': 'TATASTEEL.NS',
              'hindalco': 'HINDALCO.NS', 'vedanta': 'VEDL.NS',
              'upl': 'UPL.NS', 'dmart': 'DMART.NS', 'avenue supermarts': 'DMART.NS',
              'zomato': 'ZOMATO.NS', 'paytm': 'PAYTM.NS', 'nykaa': 'NYKAA.NS',
              'indigo': 'INDIGO.NS', 'interglobe': 'INDIGO.NS',
          }

          key = stock_name_input.lower().strip()
          if key in COMMON_MAP:
              ticker = COMMON_MAP[key]
              print(f"  Resolved via map: {ticker}")

          # Strategy 2: if not in map, try as-is appending .NS
          if not ticker:
              candidate = re.sub(r'\s+', '', stock_name_input).upper() + '.NS'
              try:
                  t = yf.Ticker(candidate)
                  info = t.info
                  if info.get('regularMarketPrice') or info.get('currentPrice') or info.get('longName'):
                      ticker = candidate
                      print(f"  Resolved via direct .NS append: {ticker}")
              except Exception:
                  pass

          # Strategy 3: yfinance search
          if not ticker:
              try:
                  results = yf.Search(stock_name_input + ' NSE India', max_results=5)
                  hits = results.quotes if hasattr(results, 'quotes') else []
                  for hit in hits:
                      sym = hit.get('symbol', '')
                      if sym.endswith('.NS') or sym.endswith('.BO'):
                          ticker = sym
                          print(f"  Resolved via yfinance search: {ticker}")
                          break
              except Exception as e:
                  print(f"  yfinance search failed: {e}")

          if not ticker:
              # Last resort: sanitise name and append .NS
              ticker = re.sub(r'[^A-Z0-9\-]', '', stock_name_input.upper()) + '.NS'
              print(f"  WARNING: Using guessed ticker {ticker} — verify manually")

          # ── Fetch company info ─────────────────────────────────────────────
          atr_stop = round(entry_price * 0.95, 2)   # 5% fallback stop

          try:
              info = yf.Ticker(ticker).info
              name   = info.get('longName') or info.get('shortName') or stock_name_input
              sector = info.get('sector') or info.get('industry') or 'NSE'
              print(f"  Name:   {name}")
              print(f"  Sector: {sector}")
          except Exception as e:
              name = stock_name_input
              print(f"  yfinance info failed: {e} — using input name")

          # ── Fetch historical data and calculate ATR stop-loss ─────────────
          try:
              hist = yf.download(ticker, period='3mo', auto_adjust=False, progress=False)
              if not hist.empty and len(hist) >= 14:
                  if isinstance(hist.columns, pd.MultiIndex):
                      hist.columns = [f"{f}_{t}" for f, t in hist.columns]
                  def col(field):
                      for c in [field, f'{field}_{ticker}', f'Adj {field}']:
                          if c in hist.columns: return c
                      return None
                  hc = col('High'); lc = col('Low'); cc = col('Close')
                  if hc and lc and cc:
                      h = hist[hc]; l = hist[lc]; c = hist[cc].shift(1)
                      tr = pd.concat([h-l, (h-c).abs(), (l-c).abs()], axis=1).max(axis=1)
                      atr_val = float(tr.rolling(14).mean().iloc[-1])
                      if not np.isnan(atr_val):
                          atr_stop = round(entry_price - 1.5 * atr_val, 2)
                          print(f"  ATR(14): ₹{atr_val:.2f}  →  ATR Stop: ₹{atr_stop}")
          except Exception as e:
              print(f"  ATR calc failed: {e} — using fallback stop ₹{atr_stop}")

          entry_time = datetime.now(timezone.utc).strftime('%H:%M')

          # ── Strategy is always 'swing' at entry; dashboard reclassifies ──
          # by time-in-market: < 365 days = swing/short-term, >= 365 = long-term
          strategy = 'swing'

          # ── Build stock object ─────────────────────────────────────────────
          base_id   = re.sub(r'[^A-Z0-9]', '', ticker.upper()) + '001'
          new_stock = {
              "id":           base_id,
              "ticker":       ticker,
              "name":         name,
              "sector":       sector,
              "strategy":     strategy,
              "entryDate":    entry_date,
              "entryTime":    entry_time,
              "entryPrice":   entry_price,
              "stopLoss":     atr_stop,
              "discussionUrl":f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','')}/issues/{issue_number}",
              "notes":        f"Added via Issue #{issue_number}. ATR stop auto-calculated. Strategy reclassified by holding period."
          }

          # ── Load and update stocks.json ────────────────────────────────────
          stocks_file = 'data/stocks.json'
          try:
              with open(stocks_file, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = {"stocks": []}

          existing = [s['ticker'].upper() for s in data.get('stocks', [])]
          if ticker.upper() in existing:
              for i, s in enumerate(data['stocks']):
                  if s['ticker'].upper() == ticker.upper():
                      data['stocks'][i] = new_stock
                      print(f"  Updated existing entry for {ticker}")
                      break
          else:
              data['stocks'].append(new_stock)
              print(f"  Added {ticker} to stocks.json")

          with open(stocks_file, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          # ── Write outputs for later steps ──────────────────────────────────
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"ticker={ticker}\n")
              f.write(f"name={name}\n")
              f.write(f"entry_price={entry_price}\n")
              f.write(f"atr_stop={atr_stop}\n")
              f.write(f"entry_date={entry_date}\n")
              f.write(f"sector={sector}\n")

          PYTHON_EOF

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/stocks.json
          git diff --staged --quiet || git commit -m "add stock: ${{ steps.parse.outputs.ticker }} via Issue #${{ github.event.issue.number }}"
          git push

      - name: Comment on issue
        uses: actions/github-script@v7
        env:
          TICKER:      ${{ steps.parse.outputs.ticker }}
          STOCK_NAME:  ${{ steps.parse.outputs.name }}
          ENTRY_PRICE: ${{ steps.parse.outputs.entry_price }}
          ATR_STOP:    ${{ steps.parse.outputs.atr_stop }}
          ENTRY_DATE:  ${{ steps.parse.outputs.entry_date }}
          SECTOR:      ${{ steps.parse.outputs.sector }}
        with:
          script: |
            const ticker     = process.env.TICKER;
            const stockName  = process.env.STOCK_NAME;
            const entryPrice = process.env.ENTRY_PRICE;
            const atrStop    = process.env.ATR_STOP;
            const entryDate  = process.env.ENTRY_DATE;
            const sector     = process.env.SECTOR;
            const dashUrl    = `https://${context.repo.owner}.github.io/${context.repo.repo}/discussions.html`;

            const body = [
              '### \u{1F4C8} Stock Added Successfully!',
              '',
              `**${stockName}** has been added to your watchlist.`,
              '',
              '| Field | Value |',
              '|---|---|',
              `| **Ticker (NSE)** | \`${ticker}\` |`,
              `| **Sector** | ${sector} |`,
              `| **Purchase Date** | ${entryDate} |`,
              `| **Entry Price** | \u20B9${entryPrice} |`,
              `| **ATR Stop-Loss** | \u20B9${atrStop} *(1.5\u00D7 ATR auto-calculated)* |`,
              `| **Strategy** | Auto-classified by holding period \u2014 short-term (&lt;1 yr) or long-term (\u22651 yr) |`,
              '',
              'Unrealised P&L% will update live on the dashboard each day.',
              '',
              `[\u{1F4CA} View Watchlist](${dashUrl})`
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Add completed label and close issue
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['completed']
              });
            } catch(e) { /* label may not exist yet */ }
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
