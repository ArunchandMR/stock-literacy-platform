name: Daily Swing Squeeze Scanner

on:
  schedule:
    # 4:00 PM IST = 10:30 UTC, Mon-Fri
    - cron: '30 10 * * 1-5'

  # Run manually anytime from Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Squeeze Scanner
        run: python scripts/scanner.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code data/swing_scanner.json swing-dashboard.html || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated dashboard
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/swing_scanner.json swing-dashboard.html
          git commit -m "🤖 Auto-scan: Swing squeeze dashboard ($(date +'%Y-%m-%d %H:%M IST'))"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No change in scan results. Skipping commit."

      - name: Scan complete
        run: |
          echo "✅ Squeeze scanner finished. GitHub Pages will auto-deploy within 1-2 minutes."
