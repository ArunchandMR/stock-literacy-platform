name: Automated Convergence Engine Scanner

on:
  schedule:
    # 4:15 PM IST = 10:45 AM UTC, Monday - Friday
    - cron: '45 10 * * 1-5'

  # Allow manual execution anytime via GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-convergence-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Squeeze & Convergence Scanner (swing-dashboard.html)
        run: python scripts/scanner.py

      - name: Run Convergence Evidence Engine (convergence-dashboard.html)
        run: python scripts/convergence_engine.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code \
            data/swing_scanner.json \
            data/stocks.json \
            swing-dashboard.html \
            data/convergence.json \
            convergence-dashboard.html \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated dashboards
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add \
            data/swing_scanner.json \
            data/stocks.json \
            swing-dashboard.html \
            data/convergence.json \
            convergence-dashboard.html
          git commit -m "🤖 Auto-scan: Convergence Engine + P&L update ($(date +'%Y-%m-%d %H:%M IST')) [skip ci]"
          git push

      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No change in scan results. Skipping commit."

      - name: Scan complete
        run: |
          echo "✅ Convergence scanner finished. GitHub Pages will auto-deploy within 1-2 minutes."
