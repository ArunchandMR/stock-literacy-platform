name: ➕ Add Stock to Watchlist
description: Just enter the company name and your buy price. Everything else is calculated automatically.
title: "[ADD] "
labels: ["pending-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📈 Add a Stock — 2 Fields Required
        Enter the company name and your purchase price. The robot will look up the NSE ticker, sector, current price, ATR-based stop-loss, and unrealised P&L automatically.

  - type: input
    id: stock_name
    attributes:
      label: 🏢 Company Name
      description: Type the company name as you know it (e.g., Reliance, HDFC Bank, Infosys, Coal India).
      placeholder: "e.g., Reliance Industries  or  HDFC Bank  or  Infosys"
    validations:
      required: true

  - type: input
    id: entry_price
    attributes:
      label: 💰 Your Purchase Price (₹)
      description: The price per share at which you bought this stock.
      placeholder: "e.g., 2450.00"
    validations:
      required: true

  - type: input
    id: entry_date
    attributes:
      label: 📅 Date of Purchase (optional)
      description: When did you buy it? Leave blank to use today's date. Format YYYY-MM-DD.
      placeholder: "e.g., 2025-03-15  (leave blank for today)"
    validations:
      required: false
